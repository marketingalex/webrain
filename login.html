<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f6">
  <title>Entrar · WeBrain</title>
  <meta name="description" content="Acesso ao WeBrain, o portal das empresas do Grupo We.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <main class="login-layout">
    <div class="access-content">
      <div class="wordmark" aria-label="WeBrain">We<span>Brain</span><i aria-hidden="true"></i></div>
      <section class="access-panel" aria-labelledby="login-title">
        <header class="form-header">
          <h1 id="login-title">Bom ter você aqui.</h1>
          <p>Entre com seu e-mail e senha.</p>
        </header>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="voce@empresa.com.br" required aria-describedby="email-error">
            <p class="field-error" id="email-error"></p>
          </div>
          <div class="field">
            <div class="field-heading"><label for="senha">Senha</label><button class="text-button" type="button" id="recover">Esqueci minha senha</button></div>
            <div class="password-control">
              <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required aria-describedby="senha-error">
              <button type="button" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button>
            </div>
            <p class="field-error" id="senha-error"></p>
          </div>
          <button class="submit-button" type="submit">Entrar</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
        </form>
        <p class="request-access">Primeiro acesso? <button class="text-button" id="request-access" type="button">Fale com a gente</button></p>
      </section>
      <aside class="demo-note" aria-label="Demonstração">
        <p>Prévia visual. Nenhum dado é enviado.</p>
        <a href="index.html">Explorar demonstração</a>
      </aside>
    </div>
    <footer class="access-footer">WeBrain · Grupo We</footer>
  </main>
  <dialog id="access-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <form method="dialog"><button class="dialog-close" aria-label="Fechar">×</button></form>
    <h2 id="dialog-title"></h2><p id="dialog-description"></p>
    <form method="dialog"><button class="submit-button" autofocus>Entendi</button></form>
  </dialog>
  <script src="assets/js/login.js"></script>
</body>
</html>
